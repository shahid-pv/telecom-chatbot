<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyTel Support Demo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main class="app">
		<header>
			<div class="brand">SkyTel</div>
			<div>
				<h1>
					SkyTel Support Demo
				</h1>
				<p>Chat as guest or select a user · <a id="open-documents" href="#documents-dialog">Support PDFs</a></p>
			</div>
		</header>
		<section class="login">
			<div>
				<strong id="me">Guest mode</strong>
				<!-- <strong>Try as demo customer</strong> -->
				<div id="customers"></div>
			</div>
			<button id="logout">Logout</button>
		</section>
		<section class="samples">
			<button>What plans do you have?</button>
			<button>What's my balance?</button>
			<button>Why was I charged yesterday?</button>
			<button>How do I deactivate my SIM?</button>
			<button>Suggest a cheaper plan</button>
		</section>
		<section id="messages" aria-live="polite"></section>
		<div id="typing" hidden>SkyTel is typing…</div>
		<form id="form">
			<input id="message" maxlength="500"
				placeholder="Ask SkyTel a question…" required>
			<button>Send</button>
		</form>
	</main>
	<dialog id="documents-dialog" aria-labelledby="documents-title">
		<div class="documents-header">
			<h2 id="documents-title">Support documents</h2>
			<button id="close-documents" type="button" aria-label="Close support documents">Close</button>
		</div>
		<div id="documents-list" class="documents-list"></div>
	</dialog>
	<script src="/app.js"></script>
</body>
</html>
